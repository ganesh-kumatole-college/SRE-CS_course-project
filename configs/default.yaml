random_seed: 42

paths:
  raw: data/raw
  interim: data/interim
  benchmark: data/benchmark
  processed: data/processed
  runs: results/runs

graph:
  backend: neo4j

node2vec:
  dimensions: 128
  walk_length: 80
  walks_per_node: 10
  return_factor: 1.0
  in_out_factor: 1.0
  window_size: 10

evaluation:
  positive_label: misconfiguration
  split:
    protocol: paper_90_10
    test_fraction: 0.1
    validation_folds: 5
  detector:
    name: lof
    scale: true
    params:
      n_neighbors: 5
      novelty: true
  threshold:
    mode: calibrated
    percentile: 95
  bootstrap:
    replicates: 2000
    alpha: 0.05
  metrics:
    - precision
    - recall
    - f1
    - pr_auc
    - roc_auc
